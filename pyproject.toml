[project]
name = "energy-consumption-analysis"
version = "0.1.0"
description = "Machine learning pipeline to predict energy consumption using regression models, stacking ensembles, and feature importance analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "torch>=2.4",
    "tqdm>=4.66",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[project.urls]
Repository = "https://github.com/somnio-kimm/energy_consumption_analysis"

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "W",
]
ignore = [
    "T201",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
