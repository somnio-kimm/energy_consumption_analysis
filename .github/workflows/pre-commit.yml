name: pre-commit

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
